<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | GuriSetu</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e8f1df,#f7f8f1);color:#1b2c22;min-height:100vh}header{background:white;display:flex;justify-content:space-between;align-items:center;padding:18px 7%}.logo{font-size:25px;font-weight:800;color:#123d2b;text-decoration:none}.logo span{color:#8bad45}nav{display:flex;gap:22px;align-items:center}nav a{color:#42584a;text-decoration:none;font-size:14px;font-weight:bold}.login-link{background:#123d2b;color:white;padding:12px 17px;border-radius:8px}.wrap{min-height:78vh;display:grid;place-items:center;padding:35px 18px}.login-card{width:100%;max-width:420px;background:white;border:1px solid #e0e9d9;border-radius:18px;padding:35px;box-shadow:0 15px 45px #123d2b14}.symbol{width:58px;height:58px;border-radius:16px;background:#e5f0d8;display:grid;place-items:center;font-size:28px}.login-card h1{color:#123d2b;margin:20px 0 8px;font-size:30px}.login-card p{color:#66766c;font-size:14px;line-height:1.6}label{display:block;font-size:13px;font-weight:bold;margin:16px 0 8px;color:#344b3b}input{width:100%;padding:13px;border:1px solid #d5dfce;border-radius:8px;font-size:14px}input:focus{outline:2px solid #b6d393}button{width:100%;margin-top:22px;padding:14px;background:#123d2b;color:white;border:0;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer}.message{padding:12px;background:#edf5e6;color:#315b25;border-radius:8px;font-size:13px;line-height:1.5;margin-top:15px}.small{text-align:center;margin-top:18px}footer{text-align:center;padding:22px;background:#102f22;color:#d5e4d8;font-size:13px}@media(max-width:750px){header{padding:16px 5%;flex-wrap:wrap;gap:14px}nav{gap:12px;flex-wrap:wrap}.login-card{padding:27px}}
</style></head><body>
<header><a class="logo" href="/">Guri<span>Setu</span></a><nav><a href="/">Home</a><a href="/exams">Exams</a><a href="/#resources">Resources</a><a class="login-link" href="/login">Login</a></nav></header>
<main class="wrap"><section class="login-card"><div class="symbol">🎓</div><h1>Welcome back</h1><p>Sign in to continue your GuriSetu exam preparation journey.</p>
<form method="POST" action="/login"><label for="username">Email or username</label><input id="username" name="username" type="text" placeholder="Enter your email or username" required><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Enter your password" required><button type="submit">Login →</button></form>
{% if message %}<div class="message">{{ message }}</div>{% endif %}<p class="small">Demo login only. Real authentication is not configured.</p></section></main><footer>© 2026 GuriSetu · Your bridge to government careers</footer></body></html>
